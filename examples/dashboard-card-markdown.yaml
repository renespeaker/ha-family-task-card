# Fallback without the custom card: a plain Markdown "Family Task Card"
# Works only with Feedparser sensors (see packages/family-task-card.yaml).
# Dashboard → Edit → Add card → Manual → paste this content.

type: markdown
content: >-
  ## 📰 Family Task Card · {{ now().strftime('%A, %d.%m.%Y') }}

  **Germany**

  {% for e in (state_attr('sensor.family_task_tagesschau', 'entries') or [])[:5] %}
  - [{{ e.title }}]({{ e.link }})
  {% endfor %}

  ---

  **My region**

  {% for e in (state_attr('sensor.family_task_wdr', 'entries') or [])[:5] %}
  - [{{ e.title }}]({{ e.link }})
  {% endfor %}
