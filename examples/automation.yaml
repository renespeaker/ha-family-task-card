# Automation: refresh feed sensors in the morning + push top 3 to your phone
# - adjust the entity_id list to your own sensors (sensor.family_task_…)
# - adjust notify.mobile_app_your_phone to your device name
#   (Developer tools → Actions → search for "notify.mobile_app").

automation:
  - alias: "Family Task Card: refresh feeds and push"
    description: >-
      Refreshes the feeds at 06:00 and sends the top 3 headlines
      as a notification.
    triggers:
      - trigger: time
        at: "06:00:00"
    conditions: []
    actions:
      - action: homeassistant.update_entity
        target:
          entity_id:
            - sensor.family_task_tagesschau
            # - sensor.family_task_wdr        # add your own regional sensor
      - delay:
          seconds: 15
      - action: notify.mobile_app_your_phone
        data:
          title: "📰 Family Task Card"
          message: >-
            {{ (state_attr('sensor.family_task_tagesschau', 'entries') or [])[:3]
               | map(attribute='title') | join('  •  ') }}
    mode: single
