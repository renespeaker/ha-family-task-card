# Package "Family Task Card" – standard feed sensors
#
# Include in configuration.yaml:
#   homeassistant:
#     packages: !include_dir_named packages
# …and copy this file to /config/packages/family-task-card.yaml.
#
# Requires the HACS integration "feedparser" (custom-components/feedparser).
#
# Naming: sensors are called "Family Task <Name>" -> entity_id
# sensor.family_task_<name>. The Family Task Card finds preset sensors via this
# convention automatically (preset: tagesschau -> sensor.family_task_tagesschau).
# Leave sensors you don't need commented out.

sensor:
  # ── Standard: national ────────────────────────────────────────────────
  # Tip: some feeds (e.g. tagesschau) send CORS headers and load directly in
  # the card without a sensor. Only add a sensor for feeds where the card
  # shows a CORS message – it names the exact sensor id to create.
  - platform: feedparser
    name: Family TaskTagesschau
    feed_url: "https://www.tagesschau.de/index~rss2.xml"
    date_format: "%d.%m. %H:%M"
    local_time: true
    scan_interval:
      minutes: 30
    inclusions: [title, link, published]

  # Deutschlandfunk (preset: dlf) -> sensor.family_task_dlf
