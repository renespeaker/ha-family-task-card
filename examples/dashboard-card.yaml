# Family Task Card — dashboard usage
#
# Install the card via HACS (type "Dashboard") — see README. Then add it via:
#   Edit dashboard → Add card → "Family Task Card".
#
# The card reads Home Assistant `todo.*` lists live. Any provider that exposes
# a todo entity works: local To-do lists, Apple Erinnerungen (CalDAV/iCloud),
# Todoist, Google Tasks, Bring!, Microsoft To Do (via MS365 To Do, see
# docs/microsoft-todo.md). Checking a task writes back to the source list.

type: custom:family-task-card
title: Familien-Aufgaben
points_per_task: 10 # points earned per completed task (default 10)
goal: 200 # optional family points goal -> progress bar
show_completed: false # also list completed tasks (dimmed). default false
persons:
  - name: Mama
    person: person.mama # optional -> avatar + friendly name
    lists: todo.mama_aufgaben # one list ...
  - name: Papa
    person: person.papa
    lists:
      - todo.papa_aufgaben # ... or several lists
      - todo.einkauf_bring
  - name: Lina
    color: "#FB7185" # optional palette override
    lists: todo.lina_aemtli

# Notes
# - `lists` are todo.* entity_ids. Leave empty to show a person with no tasks yet.
# - `person` is optional; without it the card shows initials from `name`.
# - Colors follow the Family Board Card palette automatically; `color` overrides.

# --- Optional: a second card in kid mode (big, tappable, for a wall tablet) ---
# type: custom:family-task-card
# kid_mode: true
# goal: 100
# persons:
#   - name: Lina
#     person: person.lina
#     lists: todo.lina_aemtli
#   - name: Ben
#     person: person.ben
#     lists: todo.ben_aemtli

# --- Optional: context rules — tasks react to your home's state ---
# Overdue tasks (past their due date) are marked urgent automatically
# (turn off with highlight_overdue: false). context_rules add your own:
# context_rules:
#   - match: "gieß|blumen|pflanze"   # skip watering when it's raining
#     entity: weather.home
#     state: rainy
#     effect: hide
#   - match: "müll|tonne"            # bins urgent the evening before pickup
#     entity: binary_sensor.muellabfuhr_morgen
#     state: "on"
#     effect: urgent
#     label: "Morgen Abfuhr!"

# --- Optional: reward shop (redeem points, parent PIN) ---
# Create one input_number helper per child for the redeemed points; balance =
# earned - redeemed. Tapping the 🎁 button opens the shop.
# parent_pin: "1234"
# rewards:
#   - { name: "30 Min Tablet", cost: 50, emoji: "📱" }
#   - { name: "Eis", cost: 30, emoji: "🍦" }
# persons:
#   - name: Lina
#     lists: todo.lina_aemtli
#     points_entity: input_number.lina_eingeloest

# --- Optional: levels, badges & leaderboard (from earned points, no setup) ---
# level_size: 100                 # points per level (0 = off); badge chip next to the name
# show_leaderboard: true          # ranking of persons by earned points under the board

# --- Optional: color scheme (theme-aware by default) ---
# theme: dark                     # auto (default, follows HA) | dark | light

# --- Optional: appearance (size / text / pictures), also in the visual editor ---
# All in percent; 100 = default (no change). scale zooms the whole card;
# font_scale is text only; avatar_scale is avatars/pictures + the card icon.
# scale: 90                       # overall card size
# font_scale: 120                 # text only
# avatar_scale: 140               # avatars / pictures only

# --- Optional: hands-free person switch (NFC / presence) ---
# The card follows this entity's value; HA sets it (NFC tag scan, presence, a
# button). The value is matched to each person's name / person.* / display name.
# active_person_entity: input_select.active_kid

# --- Optional: kiosk mode (wall tablet) ---
# A shared family station: an idle "who's there?" picker with big avatars; tap a
# face to see that person's tasks; after auto_return seconds of inactivity it
# returns to the picker. Combine with active_person_entity for hands-free (NFC).
# kiosk: true
# auto_return: 30                 # seconds of inactivity (default 30, 0 = never)

# --- Optional: add-task, sorting & filters ---
# allow_add: true                 # "+ add task" field per person (default on)
# sort: due                       # manual (default) | due | alpha
# hide_empty: true                # hide persons with no open tasks
# due_soon: 2                     # mark tasks due within 2 days as "due soon"
# The card follows the Home Assistant UI language (German / English).

