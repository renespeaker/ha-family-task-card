<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="Roboto, 'Segoe UI', system-ui, sans-serif">
  <!-- Illustration of the Family Task Card (adults board). Theme-aware in HA;
       shown here on a light theme. -->
  <rect width="820" height="470" rx="18" fill="#f5f6f8"/>
  <rect x="20" y="20" width="780" height="430" rx="16" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- header -->
  <rect x="40" y="40" width="42" height="42" rx="12" fill="#ecebfd"/>
  <text x="61" y="70" font-size="22" text-anchor="middle">🧹</text>
  <text x="94" y="60" font-size="20" font-weight="700" fill="#1f2933">Familien-Aufgaben</text>
  <text x="94" y="78" font-size="12" fill="#6b7280">Familien-Aufgaben</text>
  <!-- goal -->
  <text x="640" y="52" font-size="12" font-weight="700" fill="#1f2933">⭐ 120</text>
  <text x="780" y="52" font-size="12" font-weight="600" fill="#6b7280" text-anchor="end">Ziel 200</text>
  <rect x="640" y="60" width="140" height="8" rx="4" fill="#e5e7eb"/>
  <rect x="640" y="60" width="84" height="8" rx="4" fill="#3b82f6"/>

  <!-- ===== Column: Mama ===== -->
  <g>
    <rect x="40" y="104" width="238" height="326" rx="14" fill="#f7f6fe" stroke="#e5e7eb"/>
    <circle cx="70" cy="134" r="18" fill="#8B7CF6"/>
    <text x="70" y="139" font-size="13" font-weight="700" text-anchor="middle" fill="#11181f">MA</text>
    <text x="98" y="130" font-size="15" font-weight="600" fill="#1f2933">Mama</text>
    <text x="98" y="147" font-size="11" fill="#6b7280">2 offen · ⭐ 40</text>

    <!-- tile -->
    <rect x="56" y="164" width="206" height="52" rx="10" fill="#ece9fd"/>
    <rect x="56" y="164" width="3" height="52" fill="#8B7CF6"/>
    <rect x="68" y="180" width="20" height="20" rx="6" fill="none" stroke="#8B7CF6" stroke-width="2"/>
    <text x="100" y="196" font-size="17">🧺</text>
    <text x="126" y="194" font-size="13" font-weight="500" fill="#1f2933">Wäsche aufhängen</text>

    <rect x="56" y="226" width="206" height="52" rx="10" fill="#ece9fd"/>
    <rect x="56" y="226" width="3" height="52" fill="#8B7CF6"/>
    <rect x="68" y="242" width="20" height="20" rx="6" fill="none" stroke="#8B7CF6" stroke-width="2"/>
    <text x="100" y="258" font-size="17">🪴</text>
    <text x="126" y="256" font-size="13" font-weight="500" fill="#1f2933">Blumen gießen</text>

    <!-- shopping tile -->
    <rect x="56" y="288" width="206" height="52" rx="10" fill="#ece9fd"/>
    <rect x="56" y="288" width="3" height="52" fill="#8B7CF6"/>
    <rect x="68" y="304" width="20" height="20" rx="6" fill="none" stroke="#8B7CF6" stroke-width="2"/>
    <text x="100" y="320" font-size="17">🛒</text>
    <text x="126" y="313" font-size="13" font-weight="500" fill="#1f2933">Einkauf</text>
    <text x="126" y="328" font-size="10" fill="#6b7280">7 Artikel</text>
    <rect x="206" y="303" width="48" height="22" rx="11" fill="#8B7CF6"/>
    <text x="230" y="318" font-size="10" font-weight="700" fill="#ffffff" text-anchor="middle">Öffnen</text>
  </g>

  <!-- ===== Column: Papa ===== -->
  <g>
    <rect x="291" y="104" width="238" height="326" rx="14" fill="#f3fcf8" stroke="#e5e7eb"/>
    <circle cx="321" cy="134" r="18" fill="#34D399"/>
    <text x="321" y="139" font-size="13" font-weight="700" text-anchor="middle" fill="#11181f">PA</text>
    <text x="349" y="130" font-size="15" font-weight="600" fill="#1f2933">Papa</text>
    <text x="349" y="147" font-size="11" fill="#6b7280">2 offen · ⭐ 50</text>

    <!-- urgent tile -->
    <rect x="307" y="164" width="206" height="52" rx="10" fill="#fbe4e2"/>
    <rect x="307" y="164" width="3" height="52" fill="#db4437"/>
    <rect x="319" y="180" width="20" height="20" rx="6" fill="none" stroke="#db4437" stroke-width="2"/>
    <text x="351" y="196" font-size="17">⚠️</text>
    <text x="377" y="192" font-size="13" font-weight="500" fill="#1f2933">Müll rausbringen</text>
    <text x="377" y="207" font-size="10" font-weight="700" fill="#db4437">MORGEN ABFUHR!</text>

    <rect x="307" y="226" width="206" height="52" rx="10" fill="#e0f7ef"/>
    <rect x="307" y="226" width="3" height="52" fill="#34D399"/>
    <rect x="319" y="242" width="20" height="20" rx="6" fill="none" stroke="#34D399" stroke-width="2"/>
    <text x="351" y="258" font-size="17">🐕</text>
    <text x="377" y="256" font-size="13" font-weight="500" fill="#1f2933">Mit Hund raus</text>
  </g>

  <!-- ===== Column: Lina ===== -->
  <g>
    <rect x="542" y="104" width="238" height="326" rx="14" fill="#fff5f7" stroke="#e5e7eb"/>
    <circle cx="572" cy="134" r="18" fill="#FB7185"/>
    <text x="572" y="139" font-size="13" font-weight="700" text-anchor="middle" fill="#11181f">LI</text>
    <text x="600" y="130" font-size="15" font-weight="600" fill="#1f2933">Lina</text>
    <text x="600" y="147" font-size="11" fill="#6b7280">1 offen · ⭐ 30</text>

    <rect x="558" y="164" width="206" height="52" rx="10" fill="#fde8ec"/>
    <rect x="558" y="164" width="3" height="52" fill="#FB7185"/>
    <rect x="570" y="180" width="20" height="20" rx="6" fill="none" stroke="#FB7185" stroke-width="2"/>
    <text x="602" y="196" font-size="17">🧸</text>
    <text x="628" y="194" font-size="13" font-weight="500" fill="#1f2933">Zimmer aufräumen</text>

    <!-- highlighted tile -->
    <rect x="558" y="226" width="206" height="52" rx="10" fill="#fde8ec" stroke="#FB7185" stroke-width="2"/>
    <rect x="558" y="226" width="3" height="52" fill="#FB7185"/>
    <rect x="570" y="242" width="20" height="20" rx="6" fill="none" stroke="#FB7185" stroke-width="2"/>
    <text x="602" y="258" font-size="17">📚</text>
    <text x="628" y="256" font-size="13" font-weight="500" fill="#1f2933">Hausaufgaben</text>
  </g>
</svg>
