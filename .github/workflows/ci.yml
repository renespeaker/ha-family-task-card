name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Typecheck, format & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build

      - name: Verify built card is committed
        run: git diff --exit-code -- family-task-card.js
