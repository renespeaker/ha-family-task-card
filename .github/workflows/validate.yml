name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
          # 'brands' requires the domain to be added to home-assistant/brands,
          # a publishing step. Ignore it until this integration is submitted to
          # the HACS default store; custom-repository installs don't need it.
          ignore: brands
